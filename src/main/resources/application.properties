spring.application.name=milktea_backend
server.port=8080

# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/milktea_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# Database is already created by SQL script; use update or none here
spring.jpa.hibernate.ddl-auto=update
# Print SQL for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

app.admin.password=${ADMIN_PASSWORD:123456}

# ===============================
# JWT CONFIGURATION
# ===============================
# Secret key must be at least 32 characters for HS256
app.jwt.secret=${JWT_SECRET:DayLaChuoiBiMatSieuDaiCuaDuAnTraSuaGiaDinh2026SieuBaoMat}

# Token expiration in milliseconds (86400000 = 24h)
app.jwt.expiration=${JWT_EXPIRATION:86400000}

